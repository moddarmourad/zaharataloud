<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You — Zahrat Al-Oud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --linen: #f3eee4;
      --paper: #faf7f0;
      --ink: #28251f;
      --muted: #777064;
      --gold: #a58a5b;
      --line: rgba(54, 49, 39, .17);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--linen);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }
    .thankyou-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 50px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    }
    h1 {
      font-family: var(--serif);
      font-size: 38px;
      margin-top: 0;
      color: var(--ink);
    }
    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .order-details {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px;
      text-align: left;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .btn {
      background: var(--ink);
      color: var(--linen);
      border: none;
      padding: 14px 28px;
      font-size: 14px;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--gold); }
  </style>
</head>
<body>

  <div class="thankyou-card">
    <h3 style="letter-spacing: .15em; text-transform: uppercase; font-size: 13px; color: var(--gold); margin-bottom: 10px;">Zahrat Al-Oud</h3>
    <h1>Thank You for Your Order!</h1>
    <p>Your order has been successfully placed. Our team will contact you shortly to confirm and arrange your delivery.</p>
    
    <div class="order-details" id="order-summary-box">
      <!-- Loaded dynamically -->
    </div>

    <a href="index.html" class="btn">Return to Store</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('id');
    const orders = JSON.parse(localStorage.getItem("zahrataloud_orders")) || [];
    const order = orders.find(o => o.id === orderId);

    if (order) {
      document.getElementById('order-summary-box').innerHTML = `
        <strong>Order Reference:</strong> ${order.id}<br>
        <strong>Customer:</strong> ${order.name} (${order.phone})<br>
        <strong>Delivery Address:</strong> ${order.emirate}, ${order.address}<br>
        <strong>Payment Method:</strong> ${order.payment}<br><hr style="border:0; border-top:1px solid var(--line); margin: 12px 0;">
        <strong>Items Ordered:</strong><br>
        ${order.items.map(i => `${i.name} (x${i.quantity}) - AED ${(i.price * i.quantity).toFixed(2)}`).join("<br>")}<br><br>
        <strong>Total Amount: AED ${order.total.toFixed(2)}</strong>
      `;
    } else {
      document.getElementById('order-summary-box').innerHTML = `<strong>Order ID:</strong> ${orderId || 'N/A'}<br>Your order was successfully placed and recorded in our system.`;
    }
  </script>
</body>
</html>
